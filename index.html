<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מערכת הזמנת אולפנים – החוג לתקשורת צילומית</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;600&display=swap">
<style>
/* Layout: three-column booking card (studio info | month calendar | time slots), stacks to one column on phones. */
:root{
  --bg:#F2F1F0; --surface:#FFFFFF; --ink:#231F20; --muted:#6B6566; --line:#DAD7D5;
  --accent:#FDB813; --accent-ink:#231F20; --accent-soft:#FFF0C2; --accent-fg:#231F20; --taken:#E8E6E4; --warn:#B4491F;
  --f-display:'Rubik','Assistant',system-ui,sans-serif; --f-body:'Assistant','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151213; --surface:#231F20; --ink:#F3F1EF; --muted:#A39C9D; --line:#3A3536;
    --accent:#FDB813; --accent-ink:#231F20; --accent-soft:#3A2F12; --accent-fg:#FDB813; --taken:#2C2829; --warn:#F08A5D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151213; --surface:#231F20; --ink:#F3F1EF; --muted:#A39C9D; --line:#3A3536;
  --accent:#FDB813; --accent-ink:#231F20; --accent-soft:#3A2F12; --accent-fg:#FDB813; --taken:#2C2829; --warn:#F08A5D; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px}
.app{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:10px;min-width:0}
.pledge{margin:0;padding:10px 12px;border-radius:8px;background:var(--bg);border-inline-start:4px solid var(--accent);font-size:13.5px;line-height:1.55;color:var(--ink)}
.blocked{padding:14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);border-inline-start:4px solid #B3261E}
.blocked h3{margin:0 0 6px}
.blocked p{margin:6px 0;font-size:14px;line-height:1.55}
.tag-bl{display:inline-block;padding:2px 8px;border-radius:999px;background:#B3261E;color:#fff;font-size:12px;font-weight:700}
.admin h3{margin:18px 0 8px}
.sendm{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sendm-b{display:flex;gap:8px;flex-wrap:wrap}
.sendm .btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.tfnote{margin:6px 0 0}
.tfform{margin-top:10px;display:flex;flex-direction:column;gap:8px;max-width:420px}
.tfin{border-inline-start:4px solid var(--accent)}
.homebtn{all:unset;display:block;cursor:pointer;border-radius:8px;line-height:0}
.homebtn:hover{opacity:.85}
.homebtn:focus-visible{outline:3px solid var(--accent-fg,var(--ink));outline-offset:3px}
.logo{display:block;height:56px;width:auto;max-width:100%;border-radius:6px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.06em;color:var(--muted)}
h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.2;text-wrap:balance}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:7px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--ink)}
.banner.warn{background:transparent;border-color:var(--warn);color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.booker{display:grid;grid-template-columns:300px minmax(0,1fr) 280px;align-items:stretch}
.col{padding:22px;min-width:0}
.col+.col{border-inline-start:1px solid var(--line)}
.studios{display:flex;flex-direction:column;gap:6px;margin-block:14px}
.studio{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:start;border:1px solid var(--line);background:transparent;border-radius:9px;padding:9px 12px;font-weight:600}
.studio small{font-weight:400;color:var(--muted);white-space:nowrap}
.studio[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.detail h2{margin:0 0 4px;font-family:var(--f-display);font-weight:600;font-size:17px}
.detail p{margin:0 0 10px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.tags li{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.rules{margin:0;padding:12px 0 0;border-top:1px solid var(--line);list-style:none;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:13.5px}
.t{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calhead h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px}
.nav{display:flex;gap:6px}
.nav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center}
.nav button:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:12.5px;color:var(--muted);padding-block:4px;font-weight:600}
.day{aspect-ratio:1;min-height:40px;border-radius:50%;border:0;background:transparent;font-variant-numeric:tabular-nums;font-weight:600;display:grid;place-items:center;position:relative}
.day.free{background:var(--accent-soft);color:var(--accent-fg)}
.day.free:hover{outline:2px solid var(--accent)}
.day.full{color:var(--muted);text-decoration:line-through;font-weight:400}
.day.off{color:var(--muted);opacity:.45;font-weight:400;cursor:default}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.day.today::after{content:"";position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:currentColor}
.pmap{display:block;width:100%;height:auto}
.pmap .room{fill:var(--bg);stroke:var(--line);stroke-width:4}
.pmap .wall{stroke:var(--ink);stroke-width:5;fill:none}
.pmap .ttl{fill:var(--ink);font:600 46px var(--f-display);text-anchor:middle}
.pmap .ent{fill:var(--ink);font:700 30px var(--f-body);text-anchor:middle}
.pmap .st{cursor:pointer;outline:none}
.pmap .st circle{fill:var(--ink);stroke:transparent;stroke-width:8}
.pmap .st text{fill:var(--surface);font:700 54px var(--f-display);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pmap .st:hover circle{stroke:var(--accent)}
.pmap .st:focus-visible circle{stroke:var(--accent-fg)}
.pmap .st.on circle{fill:var(--accent);stroke:var(--ink)}
.pmap .st.on text{fill:var(--accent-ink)}
.pmap .st.full circle{fill:var(--muted);opacity:.6}
.pmap .st.full.on circle{fill:var(--accent);opacity:.75}
.pmap.big{min-width:700px}
.pmap .lab text{text-anchor:middle;fill:var(--ink);pointer-events:none}
.pmap .lab .nm{font:700 27px var(--f-body)}
.pmap .lab .tm{font:500 23px var(--f-body);fill:var(--muted)}
.bx{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-radius:4px;margin-inline-end:8px;vertical-align:-2px;flex:none}
[aria-checked="true"] .bx{background:var(--accent);border-color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.pmap.mini .ttl{font-size:74px}
.pmap.mini .ent{font-size:42px}
.pmap.mini .st text{font-size:64px}
.miniplan{max-width:340px;margin:18px auto 0;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.miniplan h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--muted)}
.miniplan .btn{padding:8px 12px;font-size:13.5px}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.55)}
.modal[hidden]{display:none}
.modal-card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:100%;max-width:860px;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-head h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px}
.plan-note{margin:12px 0 0;color:var(--muted);font-size:13.5px}
.note{margin:14px 0 0;padding:8px 12px;border-radius:8px;background:var(--bg);color:var(--muted);font-size:13.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:12.5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;vertical-align:-1px}
.side{display:flex;flex-direction:column;gap:12px}
.side h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:7px 0;font-weight:600;color:var(--muted)}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-fg)}
.lbl{font-size:12.5px;color:var(--muted)}
.tip{display:flex;flex-direction:column;gap:2px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.tip b{color:var(--ink);font-weight:700}
kbd{font-family:var(--f-display);font-size:12px;font-weight:500;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--surface);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:10px;margin-top:6px}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;display:grid;place-items:center}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper span{min-width:64px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.slot{user-select:none;-webkit-user-select:none}
.slots{display:flex;flex-direction:column;gap:8px;max-height:380px;overflow-y:auto;padding:2px}
.slot{border:1px solid var(--accent-fg);color:var(--accent-fg);background:transparent;border-radius:9px;padding:9px;font-weight:700;font-variant-numeric:tabular-nums}
.slot:hover{background:var(--accent-soft)}
.slot[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.slot:disabled{border-color:var(--line);background:var(--taken);color:var(--muted);font-weight:400;cursor:default;display:flex;justify-content:space-between;padding-inline:12px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:9px;padding:11px 16px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.sum{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.sum b{font-weight:700}
.field{display:flex;flex-direction:column;gap:4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:64px}
.err{color:var(--warn);font-size:13.5px;margin:0}
.done{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.check{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:16px 20px}
.item h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:16px}
.item p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.item .acts{display:flex;gap:8px;align-items:center}
.empty{padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.topr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;font-weight:600}
.who .btn{padding:6px 12px;font-size:13.5px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;flex:none}
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.lg{width:56px;height:56px;font-size:22px}
.avatar.xl{width:84px;height:84px;font-size:32px}
.photo-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photo-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.reg{max-width:540px;margin-inline:auto;padding:26px;display:flex;flex-direction:column;gap:14px}
.reg h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:21px;text-wrap:balance}
.reg p{margin:0;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2>*{min-width:0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.chk input{width:auto;margin-top:4px;flex:none}
.me{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.me>*{min-width:0}
.profile{padding:22px;display:flex;flex-direction:column;gap:14px}
.profile .head{display:flex;gap:14px;align-items:center}
.profile h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.stats{display:flex;gap:10px}
.stats div{flex:1;background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.stats b{font-family:var(--f-display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.stats span{font-size:12.5px;color:var(--muted)}
.sect{display:flex;flex-direction:column;gap:10px}
.sect>h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:16px}
.hist{padding:4px 20px}
.hist div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:14px}
.hist div+div{border-top:1px solid var(--line)}
.hist span:last-child{color:var(--muted)}
/* mobile */
.scrollhint{display:none;margin:0;font-size:12.5px;color:var(--muted);text-align:center}
@media (max-width:900px){
  .me{grid-template-columns:minmax(0,1fr)}
  .row2{grid-template-columns:1fr}
  .booker{grid-template-columns:minmax(0,1fr)}
  .col+.col{border-inline-start:0;border-top:1px solid var(--line)}
  .slots{max-height:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .studios{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .studio{min-height:48px;min-width:0;padding:8px}
  .studio .nm{white-space:normal;min-width:0}
  .col{min-width:0;padding:18px 16px}
  .detail p,.detail ul{display:none}
  .slot,.btn,.tab{min-height:44px}
  .grid{gap:4px}
  .day{min-height:0}
  input,select,textarea{font-size:16px}
  .pmap.big{min-width:820px}
  .modal{padding:8px}
  .modal-card{padding:14px;border-radius:12px}
  .modal-card .plan-note{font-size:13px}
  .scrollhint{display:block}
  #side{scroll-margin-top:8px}
}
@media (prefers-reduced-motion:no-preference){.day,.slot,.studio{transition:background .15s,border-color .15s}}

<script>
/* ===== Firebase layer: Auth (email link) + Firestore, exposed with the same small API the app uses ===== */
(function(){
  var CFG={apiKey:"AIzaSyCky1779FKakblb5q7EPtId79saSeYBGEw",authDomain:"studio-booking-f42a1.firebaseapp.com",projectId:"studio-booking-f42a1",storageBucket:"studio-booking-f42a1.firebasestorage.app",messagingSenderId:"262548233156",appId:"1:262548233156:web:37165cd96a498010bb2291"};
  var ADMIN_EMAILS=['yoramrs@edu.jmc.ac.il','kobioh@edu.jmc.ac.il','yardenga@edu.jmc.ac.il'];
  var DOMAIN='@edu.jmc.ac.il',V='10.12.0',BASE='https://www.gstatic.com/firebasejs/'+V+'/';
  var fb=null;
  function load(){
    if(!fb)fb=Promise.all([import(BASE+'firebase-app.js'),import(BASE+'firebase-auth.js'),import(BASE+'firebase-firestore.js')]).then(function(m){
      var app=m[0].initializeApp(CFG),A=m[1],F=m[2];
      var fs;try{fs=F.initializeFirestore(app,{experimentalAutoDetectLongPolling:true})}catch(e){fs=F.getFirestore(app)}
      return {A:A,F:F,auth:A.getAuth(app),fs:fs};
    });
    return fb;
  }
  var authReady=null,lastError='';
  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
  function init(){
    if(authReady)return authReady;
    authReady=load().then(async function(x){
      var A=x.A,auth=x.auth;
      if(A.isSignInWithEmailLink(auth,location.href)){
        var em=lsGet('yb_email')||window.prompt('לאישור הכניסה, הקלידו שוב את כתובת המייל הארגוני שאליה נשלח הקישור:')||'';
        try{
          await A.signInWithEmailLink(auth,em.trim().toLowerCase(),location.href);
          lsDel('yb_email');
        }catch(e){lastError='הקישור לא תקף או שפג תוקפו. בקשו קישור חדש.'}
        try{history.replaceState(null,'',location.pathname)}catch(e){}
      }
      await new Promise(function(r){var u=A.onAuthStateChanged(auth,function(){u();r()})});
      var u=auth.currentUser;
      if(u&&!(u.email&&u.email.toLowerCase().slice(-DOMAIN.length)===DOMAIN&&u.emailVerified)){
        lastError='הכניסה אפשרית רק עם מייל ארגוני בסיומת '+DOMAIN;
        await A.signOut(auth);
      }
      return x;
    });
    return authReady;
  }
  function wrapSnap(s){return {docs:s.docs.map(function(d){return {id:d.id,data:function(){return d.data()}}})}}
  function mkQuery(x,name,cons){
    return {
      where:function(f,op,v){return mkQuery(x,name,cons.concat([[f,op,v]]))},
      onSnapshot:function(cb,err){
        var F=x.F,q=F.query.apply(null,[F.collection(x.fs,name)].concat(cons.map(function(c){return F.where(c[0],c[1],c[2])})));
        return F.onSnapshot(q,function(s){cb(wrapSnap(s))},function(e){if(err)err(e)});
      }
    };
  }
  function mkDoc(x,path){
    var F=x.F,ref=F.doc(x.fs,path);
    return {
      get:async function(){var s=await F.getDoc(ref);return {exists:s.exists(),data:function(){return s.data()}}},
      set:function(d){return F.setDoc(ref,d)},
      update:function(d){return F.updateDoc(ref,d)},
      delete:function(){return F.deleteDoc(ref)},
      onSnapshot:function(cb,err){return F.onSnapshot(ref,function(s){cb({exists:s.exists(),data:function(){return s.data()}})},function(e){if(err)err(e)})},
      acquire:async function(){return {acquired:true}}
    };
  }
  window.ybAuth={
    lastError:function(){return lastError},
    send:async function(email){
      email=String(email||'').trim().toLowerCase();
      var x=await load();
      await x.A.sendSignInLinkToEmail(x.auth,email,{url:location.origin+location.pathname,handleCodeInApp:true});
      lsSet('yb_email',email);
    },
    google:async function(){
      var x=await load(),pr=new x.A.GoogleAuthProvider();
      pr.setCustomParameters({hd:'edu.jmc.ac.il',prompt:'select_account'});
      await x.A.signInWithPopup(x.auth,pr);
    },
    signOut:async function(){var x=await load();await x.A.signOut(x.auth)}
  };
  window.claude={use:async function(name){
    var x=await init();
    if(name==='db')return {collection:function(n){return mkQuery(x,n,[])},doc:function(p){return mkDoc(x,p)}};
    if(name==='user')return {
      id:async function(){return x.auth.currentUser?x.auth.currentUser.uid:null},
      email:function(){return x.auth.currentUser?x.auth.currentUser.email:''},
      canEdit:function(){var u=x.auth.currentUser;return !!(u&&u.emailVerified&&ADMIN_EMAILS.indexOf(String(u.email).toLowerCase())>=0)}
    };
    return null;
  }};
})();
</script>

  function profileRef(){return S.db.doc('data/users/'+S.uid+'/profile')}
  async function saveProfile(){
    var r=S.reg,edit=!!S.profile;
    var name=(r.name||'').trim(),sid=(r.sid||'').trim(),email=(r.email||'').trim(),phone=(r.phone||'').trim();
    if(!name){S.regErr='נא למלא שם מלא.';return renderReg()}
    if(!/^\d{5,10}$/.test(sid)){S.regErr='מספר סטודנט או תעודת זהות הם 5 עד 10 ספרות.';return renderReg()}
    if(!r.year){S.regErr='נא לבחור תפקיד.';return renderReg()}
    email=email.toLowerCase();
    if(S.authEmail)email=S.authEmail;
    if(!EMAIL_RE.test(email)){S.regErr='ההרשמה אפשרית רק עם מייל ארגוני בסיומת @'+EMAIL_DOMAIN+'.';return renderReg()}
    var ac=S.admins[admKey(email)];
    if(isAdminEmail(email)&&ac&&ac.uid&&ac.uid!==S.uid&&!S.canEdit){S.regErr='המייל הזה שמור למנהל מערכת ורשום כבר בחשבון אחר.';return renderReg()}
    var dg=phone.replace(/[\s\-()]/g,'').replace(/^\+972/,'0').replace(/^972/,'0');
    if(!/^05\d{8}$/.test(dg)){S.regErr='נא להזין מספר נייד ישראלי תקין, למשל 050-1234567.';return renderReg()}
    phone=dg.slice(0,3)+'-'+dg.slice(3);
    if(!edit&&!r.agree){S.regErr='כדי להירשם צריך לאשר את ההתחייבות.';return renderReg()}
    S.regErr='';S.regBusy=true;renderReg();
    var data={name:name,sid:sid,year:r.year,email:email,phone:phone,photo:r.photo||'',createdAt:(S.profile&&S.profile.createdAt)||Date.now(),updatedAt:Date.now()};
    try{
      await profileRef().set(data);
      S.profile=data;S.editing=false;S.regBusy=false;
      render();
      if(S.member)S.db.doc('members/'+S.uid).update({name:data.name,email:data.email,role:data.year}).catch(function(){});
      ensureAdminClaim().then(function(){});
    }catch(e){
      S.regBusy=false;S.regErr='השמירה לא הצליחה. נסו שוב בעוד רגע.';renderReg();
    }
  }

  /* ===== Booking logic ===== */
  async function claim(k,payload){
    var ref=S.db.doc('bookings/'+k);
    var lease=await ref.acquire({holder:S.uid,ttlMs:8000});
    if(!lease.acquired)return false;
    var snap=await ref.get();
    var cur=snap.exists?snap.data():null;
    if(cur&&cur.uid)return false;
    try{await ref.set(payload)}catch(e){return false}
    return true;
  }
  async function submit(){
    var f=S.form,P=S.profile,sel=selStudios(),cap=sel.reduce(function(a,t){return a+t.cap},0);
    var people=parseInt(f.people,10);
    if(!P){S.err='כדי להזמין צריך להשלים הרשמה.';return renderSide()}
    if(isBlocked(S.uid)||!canBook())return renderSide();
    if(blockedReason(S.date)){S.err='אי אפשר להזמין בתאריך הזה ('+blockedReason(S.date)+').';return renderSide()}
    if(!f.purpose){S.err='נא לבחור מטרת שימוש.';return renderSide()}
    if(!(people>=1&&people<=cap)){S.err='מספר המשתתפים בהזמנה הזאת הוא בין 1 ל-'+cap+'.';return renderSide()}
    if(myHoursOn(S.date)+S.dur>MAX_DAY){S.err='ההזמנה חורגת ממכסה של '+MAX_DAY+' שעות ליום.';return renderSide()}
    S.err='';S.busy=true;renderSide();
    var gid=Date.now().toString(36)+Math.random().toString(36).slice(2,7),claimed=[],ok=true;
    try{
      for(var i=0;i<S.dur&&ok;i++){
        for(var q=0;q<S.studios.length;q++){
          var sid=S.studios[q],h=S.start+i,k=key(sid,S.date,h);
          var good=await claim(k,{studio:sid,date:S.date,hour:h,gid:gid,uid:S.uid,name:P.name,email:P.email,year:P.year,purpose:f.purpose,people:people,notes:(f.notes||'').slice(0,300),createdAt:Date.now()});
          if(!good){ok=false;break}
          claimed.push(k);
        }
      }
    }catch(e){ok=false;S.err='השמירה לא הצליחה. נסו שוב בעוד רגע.'}
    if(!ok){
      for(var j=0;j<claimed.length;j++){try{await S.db.doc('bookings/'+claimed[j]).delete()}catch(e){}}
      S.busy=false;S.step='slots';S.start=null;S.anchor=null;
      S.notice=S.err||'אחת העמדות או השעות שבחרתם הוזמנה לפני רגע. ההזמנה לא נשמרה. בחרו שעה או עמדה אחרת.';
      S.err='';
      renderSide();
      $('#side').insertAdjacentHTML('afterbegin','<p class="err" role="alert">'+esc(S.notice)+'</p>');
      return;
    }
    S.busy=false;S.done={studios:S.studios.slice(),date:S.date,from:S.start,to:S.start+S.dur};
    S.step='done';S.start=null;
    renderSide();
    toSide();
  }
  async function cancelGroup(gid){
    var g=groups().filter(function(x){return x.gid===gid})[0];
    S.confirmCancel=null;
    if(!g)return renderList();
    for(var i=0;i<g.keys.length;i++){
      try{await S.db.doc('bookings/'+g.keys[i]).delete()}catch(e){}
    }
    if(S.transfers[gid])dropTransfer(gid,null);
    renderList();
  }

  /* ===== Events ===== */
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]'); if(!b)return;
    var a=b.dataset.act;
    if(a==='tab'){S.tab=b.dataset.v;S.confirmCancel=null;if(S.tab==='book'&&S.step==='done'){S.step='slots'}render()}
    else if(a==='home'){closePlan(true);S.tab='book';S.confirmCancel=null;S.editing=false;S.regErr='';if(S.step==='done')S.step='slots';render();window.scrollTo(0,0)}
    else if(a==='noshow-mark'){markNoShow(b.dataset.g,true)}
    else if(a==='noshow-undo'){markNoShow(b.dataset.g,false)}
    else if(a==='release-ask'){S.confirmRelease=b.dataset.u;renderList()}
    else if(a==='release-no'){S.confirmRelease=null;renderList()}
    else if(a==='release-yes'){releaseUser(b.dataset.u)}
    else if(a==='tf-open'){S.transferFor=b.dataset.g;S.tfEmail='';S.tfErr='';S.tfMsg='';renderList()}
    else if(a==='tf-close'){S.transferFor=null;S.tfErr='';renderList()}
    else if(a==='tf-send'){sendTransfer(b.dataset.g)}
    else if(a==='tf-cancel'){dropTransfer(b.dataset.g,null)}
    else if(a==='tf-accept'){acceptTransfer(b.dataset.g)}
    else if(a==='tf-decline'){S.tfMsg='';dropTransfer(b.dataset.g,'declined')}
    else if(a==='photo-pick'){var fi=$('#r-photo');if(fi)fi.click()}
    else if(a==='photo-remove'){S.reg.photo='';renderReg()}
    else if(a==='login-google'){googleLogin()}
    else if(a==='mem-ok'){decideMember(b.dataset.u,'approved')}
    else if(a==='mem-no'){decideMember(b.dataset.u,'rejected')}
    else if(a==='mem-rm'){S.confirmRemove=b.dataset.u;renderList()}
    else if(a==='mem-rm-no'){S.confirmRemove=null;renderList()}
    else if(a==='mem-rm-yes'){removeMember(b.dataset.u)}
    else if(a==='logout'){logout()}
    else if(a==='login'){login()}
    else if(a==='plan-open'){openPlan(b)}
    else if(a==='plan-close'){closePlan()}
    else if(a==='studio'){
      var sid=b.dataset.id,ix=S.studios.indexOf(sid);
      if(ix>=0){if(S.studios.length>1)S.studios.splice(ix,1)}
      else if(S.studios.length<MAX_STATIONS)S.studios.push(sid);
      S.start=null;S.anchor=null;S.msg='';S.step='slots';S.done=null;
      render();refreshModal(sid);
    }
    else if(a==='month'){S.month=new Date(S.month.getFullYear(),S.month.getMonth()+Number(b.dataset.v),1);document.querySelectorAll('.booker>.col')[1].outerHTML=renderCal()}
    else if(a==='day'){S.date=b.dataset.d;S.start=null;S.anchor=null;S.msg='';S.step='slots';S.done=null;partial();toSide()}
    else if(a==='inc'){if(S.start!=null&&S.dur<maxDur()&&slotFree(S.date,S.start+S.dur)){S.dur++;S.msg=''}renderSide()}
    else if(a==='dec'){if(S.dur>1){S.dur--;S.msg=''}renderSide()}
    else if(a==='slot'){
      var h=Number(b.dataset.h);
      if(e.shiftKey&&S.anchor!=null){
        var lo=Math.min(S.anchor,h),n=Math.abs(h-S.anchor)+1;
        if(n>maxDur()){S.msg='אפשר לבחור עד '+maxDur()+' שעות ברצף ביום הזה.'}
        else if(!rangeOK(lo,n)){S.msg='בטווח שבחרתם יש שעה תפוסה או שהמכללה סגורה בה.'}
        else{S.start=lo;S.dur=n;S.msg=''}
      } else {S.anchor=h;S.start=h;S.dur=1;S.msg=''}
      renderSide();
      var sl=document.querySelector('.slot[data-h="'+h+'"]');if(sl)sl.focus({preventScroll:true});
    }
    else if(a==='next'){S.step='form';S.err='';renderSide();toSide()}
    else if(a==='back'){S.step='slots';renderSide()}
    else if(a==='submit'){submit()}
    else if(a==='more'){S.step='slots';S.done=null;S.start=null;S.anchor=null;S.msg='';partial()}
    else if(a==='cancel'){S.confirmCancel=b.dataset.g;renderList()}
    else if(a==='cancel-no'){S.confirmCancel=null;renderList()}
    else if(a==='cancel-yes'){cancelGroup(b.dataset.g)}
    else if(a==='reg-save'){saveProfile()}
    else if(a==='reg-edit'){var p=S.profile||{};S.reg={name:p.name||'',sid:p.sid||'',year:p.year||'',email:p.email||'',phone:p.phone||'',photo:p.photo||'',agree:true};S.editing=true;S.regErr='';render()}
    else if(a==='reg-cancel'){S.editing=false;S.regErr='';render()}
    else if(a==='del-ask'){S.confirmDelete=true;renderList()}
    else if(a==='del-no'){S.confirmDelete=false;renderList()}
    else if(a==='del-yes'){deleteProfile()}
  });
  function onField(e){
    var t=e.target,d=t.dataset||{};
    if(d.photo){
      if(e.type==='change'&&t.files&&t.files[0]){
        photoFrom(t.files[0]).then(function(url){S.reg.photo=url;S.regErr='';renderReg()},function(){S.regErr='אי אפשר לקרוא את הקובץ הזה. נסו תמונה אחרת (JPG או PNG).';renderReg()});
      }
      return;
    }
    if(d.f)S.form[d.f]=t.value;
    if(d.t)S[d.t]=t.value;
    if(d.r)S.reg[d.r]=t.type==='checkbox'?t.checked:t.value;
  }
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape')closePlan();
    if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('st')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
  });
  document.addEventListener('click',function(e){var m=$('#modal');if(m&&!m.hidden&&e.target===m)closePlan()});
  document.addEventListener('mousedown',function(e){if(e.shiftKey&&e.target.closest&&e.target.closest('.slot'))e.preventDefault()});
  document.addEventListener('input',onField);
  document.addEventListener('change',onField);
  async function deleteProfile(){
    S.confirmDelete=false;
    try{await profileRef().delete();S.profile=null;S.reg={name:'',sid:'',year:'',email:'',phone:'',agree:false};S.tab='book'}catch(e){}
    render();
  }

  /* ===== Startup: render first, then connect to shared data ===== */
  render();
  (async function(){
    try{
      if(!(window.claude&&window.claude.use)){S.ready=true;renderNotice();return}
      var results=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      var db=results[0],user=results[1];
      S.db=db;
      if(user){
        try{S.uid=await user.id()}catch(e){}
        try{S.canEdit=!!(await Promise.resolve(user.canEdit()))}catch(e){}
        try{S.authEmail=String(user.email()||'').toLowerCase()}catch(e){}
        if(S.authEmail&&!S.reg.email)S.reg.email=S.authEmail;
      }
      S.ready=true;
      if(!S.uid){render();return}
      renderTabs();renderNotice();
      if(db){
        db.collection('bookings').where('date','>=',ds(new Date(TODAY.getTime()-REVIEW_DAYS*86400000))).onSnapshot(function(snap){
          var m={};
          snap.docs.forEach(function(d){var x=d.data();if(x&&x.uid)m[d.id]=x});
          S.bookings=m;
          partial();
        },function(){S.db=null;renderNotice()});
        function modChanged(){
          if(S.out)return;
          var bl=isBlocked(S.uid)+'|'+canBook();
          renderTabs();renderNotice();
          if(S.tab==='all'||S.tab==='mine')renderList();
          else if(bl!==S.wasBlocked&&$('#side'))renderSide();
          S.wasBlocked=bl;
          ensureAdminClaim();
        }
        function watch(name,field,flag){
          db.collection(name).onSnapshot(function(snap){
            var m={};snap.docs.forEach(function(d){var x=d.data();if(x)m[d.id]=x});
            S[field]=m;if(flag)S[flag]=true;modChanged();
          },function(){if(flag)S[flag]=true});
        }
        if(S.canEdit)watch('members','members');
        db.doc('members/'+S.uid).onSnapshot(function(snap){S.member=snap.exists?snap.data():null;S.memberLoaded=true;modChanged()},function(){S.memberLoaded=true});
        watch('noshows','noshows');watch('transfers','transfers');watch('releases','releases');watch('admins','admins','adminsLoaded');
        if(S.uid){
          profileRef().onSnapshot(function(snap){
            var p=snap.exists?snap.data():null;
            var changed=JSON.stringify(p)!==JSON.stringify(S.profile)||!S.profileLoaded;
            S.profileLoaded=true;
            if(!changed||S.regBusy)return;
            S.profile=p;
            if(!S.editing)render();
            ensureAdminClaim();
          },function(){S.profileLoaded=true});
          db.collection('bookings').where('uid','==',S.uid).onSnapshot(function(snap){
            var m={};
            snap.docs.forEach(function(d){var x=d.data();if(x&&x.uid)m[d.id]=x});
            S.mine=m;
            if(S.tab==='mine'&&!needReg()&&!S.out)renderMe();
          },function(){});
        }
      }
    }catch(e){S.ready=true;renderNotice()}
  })();
})();
</script>
</body>
</html>
